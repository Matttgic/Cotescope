name: CoteScope Paper Simulation

# A successful cron was last followed by a gap of several hours. Each run now
# dispatches its successor; the hourly schedule only restarts a stopped chain.
# Set the repository variable PAPER_AUTO=non to stop all automatic cycles.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-cron.yml"
      - "src/lib/paperTrading.ts"
      - "src/lib/paperStore.ts"
      - "src/lib/decisionEngine.ts"
      - "src/lib/betCapture.ts"
      - "src/app/api/cron/paper/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cotescope-paper
  cancel-in-progress: false

jobs:
  paper:
    if: vars.PAPER_AUTO != 'non'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record cycle start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Wait for the paper deployment
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 https://cotescope.vercel.app/api/paper > /tmp/cotescope-paper.json && \
              python3 -c 'import json; d=json.load(open("/tmp/cotescope-paper.json")); assert any(p["mode"] == "cotescope-balanced" for p in d["portfolios"])'; then
              exit 0
            fi
            sleep 10
          done
          echo "The paper endpoint is not ready; check the Vercel deployment and database."
          exit 1
      - name: Run prospective virtual portfolios and settlement
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is missing in GitHub Actions; paper simulation cannot run."
            exit 1
          fi

          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 55 \
            https://cotescope.vercel.app/api/cron/paper
      - name: Schedule the next cycle
        if: ${{ !cancelled() && vars.PAPER_AUTO != 'non' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PAPER_STARTED_AT: ${{ steps.start.outputs.epoch }}
          PAPER_REPOSITORY: ${{ github.repository }}
        run: |
          started=${PAPER_STARTED_AT:-$(date +%s)}
          remaining=$(( started + 300 - $(date +%s) ))
          if [ "$remaining" -gt 0 ]; then sleep "$remaining"; fi
          # workflow_dispatch is allowed to create a new run with GITHUB_TOKEN.
          # The workflow concurrency group keeps only one active cycle.
          gh workflow run scan-cron.yml --repo "$PAPER_REPOSITORY" --ref main
